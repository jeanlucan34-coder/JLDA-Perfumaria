<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLDA Perfumaria — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#1c1b19;--mute:#7b7771;--line:#e8e5df;--panel:#f5f3ef;--gold:#8a6d3b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{text-align:center;padding:64px 20px 36px;border-bottom:1px solid var(--line)}
.marca{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:.32em;text-indent:.32em}
.sub{font-size:.72rem;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.lema{color:var(--mute);margin-top:18px;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:center;align-items:center;max-width:1200px;margin:0 auto;padding:22px 20px}
.bar button{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;cursor:pointer;color:var(--mute);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
.bar button:hover{color:var(--ink)}
.bar button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.bar input{border:0;border-bottom:1px solid var(--line);background:none;padding:4px 2px;min-width:200px;font-size:.9rem}
.bar input:focus{outline:0;border-bottom-color:var(--ink)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 28px;max-width:1200px;margin:auto;padding:12px 20px 72px}
.card{display:flex;flex-direction:column}
.foto{position:relative;aspect-ratio:4/5;background:var(--panel);display:grid;place-items:center;padding:6%}
.foto img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.foto .vazio{color:var(--mute);font-size:.8rem}
.esgotado .foto img{filter:grayscale(1);opacity:.35}
.selo{position:absolute;top:12px;left:12px;background:var(--ink);color:#fff;padding:3px 10px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase}
.corpo{padding:16px 2px 0;display:flex;flex-direction:column;gap:5px;flex:1}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.45rem;font-weight:600;line-height:1.15}
.insp{font-size:.82rem;color:var(--gold)}
.fam{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.desc{font-size:.92rem;margin-top:4px}
.notas{font-size:.8rem;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.oc{display:flex;flex-wrap:wrap;margin-top:auto;padding-top:8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.oc span+span::before{content:"·";margin:0 8px;color:var(--mute)}
.adm{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 0}
.btn{background:none;border:1px solid var(--ink);padding:6px 16px;cursor:pointer;font-size:.8rem;letter-spacing:.06em}
.btn:hover{background:var(--panel)}
.btn.ouro{background:var(--ink);color:#fff}
.adm .btn{padding:4px 10px;font-size:.75rem;border-color:var(--line)}
#adminbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;font-size:.85rem}
#adminbar:empty{display:none}
.vazio-geral{grid-column:1/-1;text-align:center;color:var(--mute);padding:48px}
footer{text-align:center;color:var(--mute);font-size:.78rem;padding:28px 20px 40px;border-top:1px solid var(--line)}
footer button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:.78rem;margin-top:8px}
dialog{background:#fff;border:1px solid var(--ink);padding:24px;width:min(560px,94vw);max-height:92vh;overflow:auto;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-family:"Cormorant Garamond",serif;font-size:1.6rem;margin-bottom:8px}
label{display:block;font-size:.8rem;color:var(--mute);margin-top:10px}
dialog input[type=text],dialog select,dialog textarea{width:100%;background:#fff;border:1px solid var(--line);padding:8px;margin-top:3px;color:var(--ink)}
dialog textarea{min-height:70px;resize:vertical}
.prev{width:110px;height:110px;object-fit:contain;background:var(--panel);margin-top:6px;display:block}
.linha{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem}
</style>
</head>
<body>
<div id="adminbar"></div>
<header>
  <div class="marca">JLDA</div>
  <div class="sub">Perfumaria</div>
  <p class="lema">Releituras de grandes perfumes, com o DNA JLDA</p>
</header>

<div class="bar" role="group" aria-label="Filtros">
  <button data-g="todos" aria-pressed="true">Todos</button>
  <button data-g="masculino" aria-pressed="false">Masculinos</button>
  <button data-g="feminino" aria-pressed="false">Femininos</button>
  <button id="btnEsg" aria-pressed="false">Ocultar esgotados</button>
  <input id="busca" type="search" placeholder="Buscar perfume" aria-label="Buscar perfume">
</div>

<main id="lista"></main>

<footer>
  © JLDA Perfumaria. Releituras inspiradas em perfumes famosos; não somos afiliados às marcas originais.<br>
  <button id="btnAdmin">Área administrativa</button>
</footer>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="dlgTitulo">Perfume</h3>
    <label>Nome JLDA<input type="text" id="f_nome" required></label>
    <label>Inspirado em (perfume original)<input type="text" id="f_insp"></label>
    <label>Gênero<select id="f_gen"><option value="masculino">Masculino</option><option value="feminino">Feminino</option></select></label>
    <label>Família olfativa<input type="text" id="f_fam"></label>
    <label>Notas<textarea id="f_notas"></textarea></label>
    <label>Descrição<textarea id="f_desc"></textarea></label>
    <label>Ocasiões (separe por vírgula)<input type="text" id="f_oc"></label>
    <label>Foto<input type="file" id="f_foto" accept="image/*"></label>
    <img id="f_prev" class="prev" alt="" hidden>
    <label class="chk"><input type="checkbox" id="f_esg"> Esgotado</label>
    <div class="linha">
      <button type="button" class="btn" id="btnCancelar">Cancelar</button>
      <button type="submit" class="btn ouro">Salvar</button>
    </div>
  </form>
</dialog>

<script>
// ===== CONFIGURAÇÃO =====
const SENHA = "jlda2026";           // troque por uma senha sua
const NUMERO_WHATSAPP = "";          // opcional, reservado para uso futuro
// ========================

let dados = JSON.parse(document.getElementById("dados").textContent);
let admin = false, genero = "todos", ocultar = false, termo = "", editando = -1;
const RASCUNHO = "jlda-rascunho";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function salvarRascunho(){ try{ localStorage.setItem(RASCUNHO, JSON.stringify(dados)); }catch(e){} }

function card(p, i){
  return `<article class="card ${p.esgotado ? "esgotado" : ""}">
    <div class="foto">
      ${p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy">` : `<span class="vazio">Foto em breve</span>`}
      ${p.esgotado ? `<span class="selo">Esgotado</span>` : ""}
    </div>
    <div class="corpo">
      <h2>${esc(p.nome)}</h2>
      <div class="insp">Inspirado em ${esc(p.inspiracao)}</div>
      <div class="fam">${esc(p.familia)}</div>
      <p class="desc">${esc(p.descricao)}</p>
      ${p.notas ? `<div class="notas">${esc(p.notas)}</div>` : ""}
      <div class="oc">${(p.ocasioes || []).map(o => `<span>${esc(o)}</span>`).join("")}</div>
    </div>
    ${admin ? `<div class="adm">
      <button class="btn" data-a="editar" data-i="${i}">Editar</button>
      <button class="btn" data-a="esgotar" data-i="${i}">${p.esgotado ? "Voltar ao estoque" : "Marcar esgotado"}</button>
      <button class="btn" data-a="excluir" data-i="${i}">Excluir</button>
    </div>` : ""}
  </article>`;
}

function render(){
  const t = norm(termo);
  const itens = dados.map((p, i) => [p, i]).filter(([p]) =>
    (genero === "todos" || p.genero === genero) &&
    !(ocultar && p.esgotado) &&
    (!t || norm(p.nome + " " + p.inspiracao).includes(t)));
  $("lista").innerHTML = itens.length ? itens.map(([p, i]) => card(p, i)).join("") : `<p class="vazio-geral">Nenhum perfume encontrado.</p>`;
  $("adminbar").innerHTML = admin
    ? `<strong>Modo administrador</strong> <span>${dados.length} perfumes</span>
       <button class="btn ouro" id="aNovo">+ Novo perfume</button>
       <button class="btn ouro" id="aBaixar">Baixar arquivo atualizado</button>
       <button class="btn" id="aSair">Sair</button>` : "";
}

// filtros
document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
  genero = b.dataset.g;
  document.querySelectorAll("[data-g]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
$("btnEsg").onclick = e => { ocultar = !ocultar; e.target.setAttribute("aria-pressed", ocultar); render(); };
$("busca").oninput = e => { termo = e.target.value; render(); };

// login
$("btnAdmin").onclick = () => {
  const s = prompt("Senha de administrador:");
  if (s === null) return;
  if (s !== SENHA) return alert("Senha incorreta.");
  admin = true;
  try{
    const r = localStorage.getItem(RASCUNHO);
    if (r && confirm("Há alterações não publicadas salvas neste navegador. Carregar?")) dados = JSON.parse(r);
  }catch(e){}
  render();
};

// ações dos cards e da barra
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const i = +b.dataset.i;
  if (b.dataset.a === "esgotar"){ dados[i].esgotado = !dados[i].esgotado; salvarRascunho(); render(); }
  if (b.dataset.a === "excluir" && confirm(`Excluir "${dados[i].nome}"?`)){ dados.splice(i, 1); salvarRascunho(); render(); }
  if (b.dataset.a === "editar") abrir(i);
  if (b.id === "aNovo") abrir(-1);
  if (b.id === "aSair"){ admin = false; render(); }
  if (b.id === "aBaixar") baixar();
});

// formulário
let fotoAtual = "";
function abrir(i){
  editando = i;
  const p = i >= 0 ? dados[i] : {nome:"",inspiracao:"",genero:"masculino",familia:"",notas:"",descricao:"",ocasioes:[],foto:"",esgotado:false};
  $("dlgTitulo").textContent = i >= 0 ? "Editar perfume" : "Novo perfume";
  $("f_nome").value = p.nome; $("f_insp").value = p.inspiracao; $("f_gen").value = p.genero;
  $("f_fam").value = p.familia; $("f_notas").value = p.notas; $("f_desc").value = p.descricao;
  $("f_oc").value = (p.ocasioes || []).join(", "); $("f_esg").checked = p.esgotado; $("f_foto").value = "";
  fotoAtual = p.foto; mostrarPrev();
  $("dlg").showModal();
}
function mostrarPrev(){ $("f_prev").hidden = !fotoAtual; if (fotoAtual) $("f_prev").src = fotoAtual; }
$("btnCancelar").onclick = () => $("dlg").close();

// reduz a foto para ~700px (JPEG) para o arquivo não ficar pesado
$("f_foto").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const m = 700, k = Math.min(1, m / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k;
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(img, 0, 0, c.width, c.height);
    fotoAtual = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(url); mostrarPrev();
  };
  img.src = url;
};

$("form").onsubmit = () => {
  const p = {
    nome: $("f_nome").value.trim(), inspiracao: $("f_insp").value.trim(), genero: $("f_gen").value,
    familia: $("f_fam").value.trim(), notas: $("f_notas").value.trim(), descricao: $("f_desc").value.trim(),
    ocasioes: $("f_oc").value.split(",").map(s => s.trim()).filter(Boolean),
    foto: fotoAtual, esgotado: $("f_esg").checked
  };
  if (editando >= 0) dados[editando] = p; else dados.push(p);
  salvarRascunho(); render();
};

// gera o arquivo atualizado para subir no GitHub
function baixar(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector("#lista").innerHTML = "";
  clone.querySelector("#adminbar").innerHTML = "";
  clone.querySelector("#dlg").removeAttribute("open");
  clone.querySelector("#dados").textContent = "[\n" + dados.map(p => JSON.stringify(p)).join(",\n").replace(/</g, "\\u003c") + "\n]";
  const html = "<!DOCTYPE html>\n" + clone.outerHTML;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], {type:"text/html"}));
  a.download = "index.html"; a.click();
  try{ localStorage.removeItem(RASCUNHO); }catch(e){}
  alert("Arquivo index.html baixado. Suba-o no GitHub substituindo o antigo para publicar as mudanças.");
}

render();
</script>
</body>
</html>
